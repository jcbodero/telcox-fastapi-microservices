name: Audit Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "services/audit_service/**"
      - ".github/workflows/audit-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/telcox-audit-service
  RELEASE_NAME: audit-service
  NAMESPACE: telcox
  CHART_PATH: services/audit_service/setup/helm

jobs:
  build-push-and-deploy:
    name: Build, Push and Deploy Audit Service
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        shell: bash
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Compile Audit Service
        shell: bash
        run: |
          python3 -m compileall services/audit_service

      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -f services/audit_service/setup/Dockerfile \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Push Docker image
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"

      - name: Deploy with Helm
        shell: bash
        run: |
          helm upgrade --install "${RELEASE_NAME}" "${CHART_PATH}" \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set image.repository="${IMAGE_NAME}" \
            --set image.tag="${IMAGE_TAG}"

      - name: Verify Kubernetes rollout
        shell: bash
        run: |
          kubectl rollout status deployment/"${RELEASE_NAME}" \
            --namespace "${NAMESPACE}" \
            --timeout=120s

name: Infraestructura

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telcox-observability
  cancel-in-progress: false

env:
  RELEASE_NAME: observability
  NAMESPACE: observability
  CHART_PATH: infra/observability/setup/helm
  KUBECONFIG: /home/julio/.kube/config
  PUBLIC_HOST: ${{ vars.PUBLIC_HOST || 'reto1.telcox.site' }}
  GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD || 'TelcoXAdmin123!' }}

jobs:
  deploy:
    name: Deploy Grafana Loki Promtail
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes access
        shell: bash
        run: |
          kubectl get nodes
          helm list --all-namespaces

      - name: Deploy observability stack
        shell: bash
        run: |
          helm upgrade --install "${RELEASE_NAME}" "${CHART_PATH}" \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set global.host="${PUBLIC_HOST}" \
            --set grafana.adminPassword="${GRAFANA_ADMIN_PASSWORD}" \
            --wait \
            --timeout 5m

      - name: Verify observability pods
        shell: bash
        run: |
          kubectl rollout status deployment/grafana --namespace "${NAMESPACE}" --timeout=300s
          kubectl rollout status deployment/loki --namespace "${NAMESPACE}" --timeout=300s
          kubectl rollout status daemonset/promtail --namespace "${NAMESPACE}" --timeout=300s

      - name: Show observability diagnostics on failure
        if: failure()
        shell: bash
        run: |
          kubectl get pods,svc,ingress --namespace "${NAMESPACE}" -o wide
          kubectl describe pods --namespace "${NAMESPACE}" || true
          kubectl logs --namespace "${NAMESPACE}" -l app.kubernetes.io/name=grafana --tail=100 || true
          kubectl logs --namespace "${NAMESPACE}" -l app.kubernetes.io/name=loki --tail=100 || true
          kubectl logs --namespace "${NAMESPACE}" -l app.kubernetes.io/name=promtail --tail=100 || true

name: UI CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - "docs/**"
      - "scripts/generate_architecture_html.py"
      - "scripts/prepare_ui_manuals.py"
      - ".github/workflows/ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: telcox-ui
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/telcox-ui
  RELEASE_NAME: telcox-ui
  NAMESPACE: telcox
  CHART_PATH: ui/setup/helm
  KUBECONFIG: /home/julio/.kube/config
  PUBLIC_HOST: ${{ vars.PUBLIC_HOST || 'reto1.telcox.site' }}
  NEXT_PUBLIC_KEYCLOAK_REALM: telcox
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: telcox-web
  NEXT_PUBLIC_MIXPANEL_TOKEN: ${{ vars.NEXT_PUBLIC_MIXPANEL_TOKEN }}
  NEXT_PUBLIC_MIXPANEL_API_HOST: ${{ vars.NEXT_PUBLIC_MIXPANEL_API_HOST || 'https://api-js.mixpanel.com' }}
  MANUALS_BASIC_AUTH_SECRET_NAME: telcox-manuals-basic-auth
  MANUALS_BASIC_AUTH_USERS: ${{ secrets.MANUALS_BASIC_AUTH_USERS }}
  MANUALS_APP_AUTH_SECRET_NAME: telcox-manuals-app-auth
  MANUALS_APP_AUTH_USER: ${{ vars.MANUALS_APP_AUTH_USER }}
  MANUALS_APP_AUTH_PASSWORD: ${{ secrets.MANUALS_APP_AUTH_PASSWORD }}

jobs:
  build-push-and-deploy:
    name: Build, Push and Deploy UI
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        shell: bash
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_KEYCLOAK_URL=https://${PUBLIC_HOST}/auth" >> "$GITHUB_ENV"

      - name: Prepare manuals static files
        shell: bash
        run: |
          python3 scripts/prepare_ui_manuals.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Build Next.js
        shell: bash
        working-directory: ui
        run: |
          npm ci
          NEXT_PUBLIC_KEYCLOAK_URL="${NEXT_PUBLIC_KEYCLOAK_URL}" \
          NEXT_PUBLIC_KEYCLOAK_REALM="${NEXT_PUBLIC_KEYCLOAK_REALM}" \
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID="${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}" \
          NEXT_PUBLIC_MIXPANEL_TOKEN="${NEXT_PUBLIC_MIXPANEL_TOKEN}" \
          NEXT_PUBLIC_MIXPANEL_API_HOST="${NEXT_PUBLIC_MIXPANEL_API_HOST}" \
          NEXT_PUBLIC_API_BASE_URL="" \
          npm run build

      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -f ui/setup/Dockerfile \
            --build-arg NEXT_PUBLIC_KEYCLOAK_URL="${NEXT_PUBLIC_KEYCLOAK_URL}" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_REALM="${NEXT_PUBLIC_KEYCLOAK_REALM}" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_CLIENT_ID="${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}" \
            --build-arg NEXT_PUBLIC_MIXPANEL_TOKEN="${NEXT_PUBLIC_MIXPANEL_TOKEN}" \
            --build-arg NEXT_PUBLIC_MIXPANEL_API_HOST="${NEXT_PUBLIC_MIXPANEL_API_HOST}" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="" \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Push Docker image
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"

      - name: Verify Kubernetes access
        shell: bash
        run: |
          kubectl get nodes
          helm list --namespace "${NAMESPACE}"

      - name: Configure manuals app auth secret
        shell: bash
        run: |
          if [ -z "${MANUALS_APP_AUTH_PASSWORD}" ]; then
            echo "ERROR: Missing MANUALS_APP_AUTH_PASSWORD secret."
            echo "Create it in GitHub Secrets before deploying /manuales."
            exit 1
          fi

          kubectl create secret generic "${MANUALS_APP_AUTH_SECRET_NAME}" \
            --namespace "${NAMESPACE}" \
            --from-literal=password="${MANUALS_APP_AUTH_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure manuals Basic Auth
        shell: bash
        run: |
          if [ -z "${MANUALS_BASIC_AUTH_USERS}" ]; then
            echo "WARNING: Missing MANUALS_BASIC_AUTH_USERS secret."
            echo "Traefik Basic Auth middleware will be disabled for this deploy."
            echo "The Next.js /manuales middleware remains enabled."
            echo "To enable Traefik Basic Auth too, create it with an htpasswd line:"
            echo "  htpasswd -nbB usuario 'contrasena-segura'"
            echo "MANUALS_TRAEFIK_AUTH_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          kubectl create secret generic "${MANUALS_BASIC_AUTH_SECRET_NAME}" \
            --namespace "${NAMESPACE}" \
            --from-literal=users="${MANUALS_BASIC_AUTH_USERS}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "MANUALS_TRAEFIK_AUTH_ENABLED=true" >> "$GITHUB_ENV"

      - name: Deploy with Helm
        shell: bash
        run: |
          helm upgrade --install "${RELEASE_NAME}" "${CHART_PATH}" \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set image.repository="${IMAGE_NAME}" \
            --set image.tag="${IMAGE_TAG}" \
            --set ingress.host="${PUBLIC_HOST}" \
            --set manuals.auth.enabled="${MANUALS_TRAEFIK_AUTH_ENABLED}" \
            --set manuals.auth.existingSecret="${MANUALS_BASIC_AUTH_SECRET_NAME}" \
            --set-string manuals.appAuth.username="${MANUALS_APP_AUTH_USER}" \
            --set manuals.appAuth.existingSecret="${MANUALS_APP_AUTH_SECRET_NAME}"

      - name: Verify Kubernetes rollout
        shell: bash
        run: |
          kubectl rollout status deployment/"${RELEASE_NAME}" \
            --namespace "${NAMESPACE}" \
            --timeout=300s

      - name: Show Kubernetes diagnostics on failure
        if: failure()
        shell: bash
        run: |
          kubectl get pods --namespace "${NAMESPACE}" -o wide
          kubectl describe deployment/"${RELEASE_NAME}" --namespace "${NAMESPACE}" || true
          kubectl describe pods --namespace "${NAMESPACE}" -l app.kubernetes.io/instance="${RELEASE_NAME}" || true

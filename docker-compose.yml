version: '3.8'

services:
  # PostgreSQL for audit trail
  postgres_telcox:
    image: postgres:15-alpine
    container_name: telcox_postgres
    environment:
      POSTGRES_USER: telcox
      POSTGRES_PASSWORD: telcox_secure_password_2026
      POSTGRES_DB: telcox_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telcox"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for flexible audit storage
  mongo_telcox:
    image: mongo:6.0-alpine
    container_name: telcox_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: telcox_secure_password_2026
      MONGO_INITDB_DATABASE: telcox_audit
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching layer
  redis_telcox:
    image: redis:7-alpine
    container_name: telcox_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Customer Service
  customer_service:
    build:
      context: .
      dockerfile: services/customer_service/setup/Dockerfile
    container_name: telcox_customer_service
    ports:
      - "8001:8000"
    environment:
      SERVICE_PORT: 8000
      AUDIT_BACKEND: postgres
      POSTGRES_URL: postgresql://telcox:telcox_secure_password_2026@postgres_telcox:5432/telcox_audit
      REDIS_URL: redis://redis_telcox:6379/0
      MONGO_URL: mongodb://admin:telcox_secure_password_2026@mongo_telcox:27017/telcox_audit
    depends_on:
      postgres_telcox:
        condition: service_healthy
      redis_telcox:
        condition: service_healthy
    volumes:
      - ./services/customer_service:/app

  # Onboarding Service with document and facial verification simulation
  onboarding_service:
    build:
      context: .
      dockerfile: services/onboarding_service/setup/Dockerfile
    container_name: telcox_onboarding_service
    ports:
      - "8008:8000"
    environment:
      SERVICE_PORT: 8000
      AUDIT_BACKEND: postgres
      IDENTITY_PROVIDER: keycloak
      KEYCLOAK_REALM: telcox
      KYC_PROVIDER: mock-kyc
      FACE_PROVIDER: mock-face-match
      POSTGRES_URL: postgresql://telcox:telcox_secure_password_2026@postgres_telcox:5432/telcox_audit
      REDIS_URL: redis://redis_telcox:6379/0
      MONGO_URL: mongodb://admin:telcox_secure_password_2026@mongo_telcox:27017/telcox_audit
    depends_on:
      postgres_telcox:
        condition: service_healthy
      redis_telcox:
        condition: service_healthy
    volumes:
      - ./services/onboarding_service:/app

  # Payment Service
  payment_service:
    build:
      context: .
      dockerfile: services/payment_service/setup/Dockerfile
    container_name: telcox_payment_service
    ports:
      - "8006:8000"
    environment:
      SERVICE_PORT: 8000
      POSTGRES_URL: postgresql://telcox:telcox_secure_password_2026@postgres_telcox:5432/telcox_audit
      REDIS_URL: redis://redis_telcox:6379/0
      MONGO_URL: mongodb://admin:telcox_secure_password_2026@mongo_telcox:27017/telcox_audit
    depends_on:
      postgres_telcox:
        condition: service_healthy
      redis_telcox:
        condition: service_healthy
    volumes:
      - ./services/payment_service:/app

  # Audit Service
  audit_service:
    build:
      context: .
      dockerfile: services/audit_service/setup/Dockerfile
    container_name: telcox_audit_service
    ports:
      - "8007:8000"
    environment:
      SERVICE_PORT: 8000
      POSTGRES_URL: postgresql://telcox:telcox_secure_password_2026@postgres_telcox:5432/telcox_audit
      REDIS_URL: redis://redis_telcox:6379/0
      MONGO_URL: mongodb://admin:telcox_secure_password_2026@mongo_telcox:27017/telcox_audit
    depends_on:
      postgres_telcox:
        condition: service_healthy
      redis_telcox:
        condition: service_healthy
    volumes:
      - ./services/audit_service:/app

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  telcox_network:
    driver: bridge

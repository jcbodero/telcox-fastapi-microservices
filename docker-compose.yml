

services:
  # PostgreSQL for audit trail
  postgres_telcox:
    image: postgres:15-alpine
    container_name: telcox_postgres
    environment:
      POSTGRES_USER: telcox
      POSTGRES_PASSWORD: telcox_secure_password_2026
      POSTGRES_DB: telcox_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telcox"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for flexible audit storage
  mongo_telcox:
    image: mongo:6.0
    container_name: telcox_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: telcox_secure_password_2026
      MONGO_INITDB_DATABASE: telcox_audit
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' localhost:27017/test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching layer
  redis_telcox:
    image: redis:7-alpine
    container_name: telcox_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Customer Service
 
volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  telcox_network:
    driver: bridge

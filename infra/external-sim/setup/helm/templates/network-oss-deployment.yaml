apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-oss-mock
  namespace: {{ .Values.namespace.name | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-oss-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-oss-mock
    spec:
      containers:
        - name: network-oss-mock
          image: "{{ .Values.networkOss.image.repository }}:{{ .Values.networkOss.image.tag }}"
          imagePullPolicy: {{ .Values.networkOss.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.networkOss.service.targetPort }}
          resources:
            {{- toYaml .Values.networkOss.resources | nindent 12 }}

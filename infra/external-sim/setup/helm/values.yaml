namespace:
  create: false
  name: external-sim

global:
  host: reto1.telcox.site

ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    secretName: telcox-external-sim-tls
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.priority: "50"
    traefik.ingress.kubernetes.io/router.tls: "true"

sri:
  image:
    repository: ghcr.io/jcbodero/telcox-sri-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 80m
      memory: 160Mi


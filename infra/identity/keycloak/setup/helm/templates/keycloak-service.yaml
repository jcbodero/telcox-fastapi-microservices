apiVersion: v1
kind: Service
metadata:
  name: {{ include "telcox-keycloak.fullname" . }}
  labels:
    {{- include "telcox-keycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "telcox-keycloak.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak

{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ required "Set auth.password or auth.existingSecret for MongoDB" .Values.auth.password | quote }}
  database: {{ .Values.auth.database | quote }}
  url: {{ printf "mongodb://%s:%s@%s:%d/%s?authSource=admin" .Values.auth.username .Values.auth.password (printf "%s.%s.svc.cluster.local" .Release.Name .Release.Namespace) (.Values.service.port | int) .Values.auth.database | quote }}
{{- end }}

{{- if .Values.grafana.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    {{- include "telcox-observability.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.grafana.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.grafana.ingress.className }}
  rules:
    - host: {{ .Values.global.host | quote }}
      http:
        paths:
          - path: {{ .Values.grafana.rootPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: {{ .Values.grafana.service.port }}
{{- end }}


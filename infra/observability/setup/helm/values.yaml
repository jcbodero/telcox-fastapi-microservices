global:
  host: reto1.telcox.site

grafana:
  image: grafana/grafana:10.4.2
  replicas: 1
  adminUser: admin
  adminPassword: TelcoXAdmin123!
  rootPath: /grafana
  service:
    port: 80
    targetPort: 3000
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  image: grafana/loki:2.9.8
  replicas: 1
  service:
    port: 3100
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

promtail:
  image: grafana/promtail:2.9.8
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

replicaCount: 1

image:
  repository: ghcr.io/jcbodero/telcox-network-oss-mock
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8012

ingress:
  enabled: false
  className: traefik
  host: reto1.telcox.site
  tls:
    enabled: false
    secretName: telcox-network-oss-mock-tls
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    cpu: 80m
    memory: 160Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: AUDIT_BACKEND
              value: {{ .Values.audit.backend | quote }}
            {{- if eq .Values.audit.backend "postgres" }}
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.audit.postgresUrlSecretName | quote }}
                  key: {{ .Values.audit.postgresUrlSecretKey | quote }}
            {{- end }}
            - name: IDENTITY_PROVIDER
              value: {{ .Values.identity.provider | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.identity.keycloakRealm | quote }}
            - name: KYC_PROVIDER
              value: {{ .Values.identity.kycProvider | quote }}
            - name: FACE_PROVIDER
              value: {{ .Values.identity.faceProvider | quote }}
          readinessProbe:
            httpGet:
              path: "{{ .Values.basePath }}/health"
              port: http
          livenessProbe:
            httpGet:
              path: "{{ .Values.basePath }}/health"
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}



